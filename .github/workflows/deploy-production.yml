name: Deploy to Production

# Every push to the production branch goes live on the BestDeal server, 213.136.94.207.
# The SSH key in the BESTDEAL_DEPLOY_KEY secret can only run /opt/bestdeal/bin/deploy on it;
# that script builds the code, backs up the database and swaps the containers
# (see deploy/README.md). Secrets stay on the server in /opt/bestdeal/.env, never in this repo.

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Send the code to the server and deploy it
        env:
          DEPLOY_KEY: ${{ secrets.BESTDEAL_DEPLOY_KEY }}
          # The server's own key, so the code can only be sent to the real server
          HOST_KEY: "213.136.94.207 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICbPx2LmfYR2QSs0xSrL+6T0T5ttFGpgzQEzn2OCaxu/"
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bestdeal
          chmod 600 ~/.ssh/bestdeal
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          git archive --format=tar HEAD backend frontend deploy \
            | ssh -i ~/.ssh/bestdeal -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
                root@213.136.94.207 "$GITHUB_SHA"
