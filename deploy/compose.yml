# BestDeal production on its own server (see deploy/README.md).
# Run only through /opt/bestdeal/bin/deploy, which sets RELEASE_TAG and reads /opt/bestdeal/.env.
name: bestdeal

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:18-alpine
    container_name: bestdeal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bestdeal
      POSTGRES_USER: bestdeal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is missing from /opt/bestdeal/.env}
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker
      - db-data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bestdeal -d bestdeal"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  backend:
    image: bestdeal-backend:${RELEASE_TAG:?RELEASE_TAG is set by the deploy script}
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    restart: unless-stopped
    env_file: /opt/bestdeal/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY: "1"
      DATABASE_URL: postgresql://bestdeal:${DB_PASSWORD}@db:5432/bestdeal?schema=public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    logging: *logging

  web:
    image: bestdeal-web:${RELEASE_TAG:?RELEASE_TAG is set by the deploy script}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is missing from /opt/bestdeal/.env}
      TEST_DOMAIN: ${TEST_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # HTTPS certificates; keep this volume or Let's Encrypt has to issue new ones
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    logging: *logging

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  internal:
